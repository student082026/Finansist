<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Финансист — твои деньги под контролем</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#10b981; --primary-dark:#059669; --primary-light:#d1fae5; --primary-50:#ecfdf5;
  --bg:#f4f8f7; --card:#fff; --text:#0f172a; --muted:#64748b; --muted-2:#94a3b8;
  --border:#e6eeeb; --border-2:#eef4f1;
  --red:#ef4444; --red-light:#fee2e2; --red-50:#fef2f2;
  --blue:#3b82f6; --blue-light:#dbeafe; --violet:#8b5cf6; --amber:#f59e0b;
  --gold:#f59e0b; --gold-dark:#d97706;
  --radius:14px; --radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.05);
  --shadow:0 4px 20px rgba(16,24,40,.07);
  --shadow-lg:0 18px 50px rgba(16,24,40,.14);
  --ease:cubic-bezier(.22,1,.36,1);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;outline:none}
a{text-decoration:none;color:inherit}
input,textarea,select{outline:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d3dedb;border-radius:10px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#b8c8c4}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes growBar{from{width:0 !important}}
@keyframes growBarV{from{height:0 !important}}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 12px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(120%)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp .6s var(--ease) both}
.scale-in{animation:scaleIn .4s var(--ease) both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}

.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh;animation:fadeIn .4s ease}
.auth-left{background:linear-gradient(155deg,#e9fbf4 0%,#f2fdf9 45%,#ddf5ec 100%);padding:56px 60px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.auth-left::before{content:'';position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.14),transparent 68%);top:-180px;right:-180px}
.auth-left::after{content:'';position:absolute;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.10),transparent 68%);bottom:-200px;left:-160px}
.auth-left-inner{position:relative;z-index:2;max-width:540px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:44px}
.brand-logo{width:44px;height:44px;flex:none}
.brand-logo svg{width:100%;height:100%}
.brand-name{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1}
.brand-sub{font-size:12px;color:var(--muted);margin-top:3px}
.auth-h1{font-size:42px;line-height:1.12;font-weight:800;letter-spacing:-1.3px;margin-bottom:18px}
.auth-h1 span{color:var(--primary)}
.auth-p{color:#5b6b75;font-size:15.5px;line-height:1.65;margin-bottom:34px;max-width:460px}
.feat{display:flex;gap:16px;margin-bottom:22px;align-items:flex-start}
.feat-icon{width:50px;height:50px;flex:none;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(16,185,129,.14);color:var(--primary);transition:transform .35s var(--ease)}
.feat-icon svg{width:22px;height:22px}
.feat:hover .feat-icon{transform:translateY(-4px) rotate(-6deg) scale(1.05)}
.feat-title{font-weight:700;font-size:15px;margin-bottom:3px}
.feat-text{font-size:13.5px;color:var(--muted);line-height:1.55}
.auth-deco{position:relative;z-index:2;margin-top:46px;height:250px}
.auth-phone{width:260px;background:#fff;border-radius:26px;padding:18px;box-shadow:0 26px 60px rgba(16,185,129,.20);position:absolute;left:0;bottom:0;animation:floaty 6.5s ease-in-out infinite}
.auth-phone .ph-bal{background:linear-gradient(135deg,#10b981,#059669);border-radius:16px;padding:16px;color:#fff}
.auth-phone .ph-bal small{opacity:.85;font-size:11px;display:block}
.auth-phone .ph-bal b{display:block;font-size:24px;margin-top:4px;letter-spacing:-.5px}
.auth-phone .ph-bal i{font-size:11px;opacity:.92;font-style:normal}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:16px}
.bars div{flex:1;background:var(--primary-light);border-radius:5px;animation:growBarV 1s var(--ease) both}
.auth-note{position:absolute;left:278px;bottom:46px;font-size:15px;color:#5b6b75;line-height:1.5;font-style:italic;max-width:190px;font-weight:500}
.auth-note svg{margin-top:8px;color:var(--primary)}
.auth-right{display:flex;align-items:center;justify-content:center;padding:48px 40px;background:#fff;overflow-y:auto}
.auth-form-wrap{width:100%;max-width:420px}
.auth-switch{text-align:right;font-size:13.5px;color:var(--muted);margin-bottom:26px}
.auth-switch a{color:var(--primary);font-weight:600;margin-left:6px;transition:opacity .2s;cursor:pointer}
.auth-switch a:hover{opacity:.75}
.auth-right h2{font-size:30px;font-weight:800;letter-spacing:-.8px;margin-bottom:8px}
.auth-right .sub{color:var(--muted);font-size:14.5px;line-height:1.55;margin-bottom:28px}
.auth-hint{margin-top:18px;padding:12px 14px;background:var(--primary-50);border-radius:12px;font-size:12px;color:#475569;line-height:1.55;border:1px solid #d1fae5}
.auth-hint b{color:var(--primary-dark);font-weight:700}
.auth-hint code{background:#fff;padding:2px 6px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--primary-dark);border:1px solid #d1fae5}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:#334155}
.field label .req{color:var(--red)}
.field .hint{display:block;font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:400;line-height:1.4}
.field .hint b{color:#475569;font-weight:600}

.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap > svg.left{
  position:absolute !important;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  width:18px !important;
  height:18px !important;
  max-width:18px !important;
  max-height:18px !important;
  flex:none;
  pointer-events:none;
  z-index:1;
  color:var(--muted-2);
  transition:color .2s;
}
.input-wrap > svg:not(.left){width:18px;height:18px;flex:none}
.input-wrap .right-btn{position:absolute;right:12px;color:var(--muted-2);padding:6px;border-radius:8px;transition:color .2s,background .2s;display:flex;z-index:3}
.input-wrap .right-btn svg{width:17px;height:17px}
.input-wrap .right-btn:hover{color:var(--primary);background:var(--primary-50)}
.input-wrap input,.input-wrap select,.input-wrap textarea{
  width:100%;padding:14px 16px 14px 46px;border:1.5px solid var(--border);
  border-radius:12px;font-size:14.5px;background:#fbfdfc;
  transition:border-color .2s,background .2s,box-shadow .2s;
  position:relative;z-index:2;
}
.input-wrap.no-icon input,.input-wrap.no-icon select{padding-left:16px}
.input-wrap textarea{padding-left:16px;min-height:120px;resize:vertical;line-height:1.55}
.input-wrap select{appearance:none;cursor:pointer}
.input-wrap input:focus,.input-wrap select:focus,.input-wrap textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(16,185,129,.10)}
.input-wrap input:focus ~ svg.left,
.input-wrap textarea:focus ~ svg.left{color:var(--primary)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#475569;line-height:1.5;margin:18px 0 22px;cursor:pointer}
.check input{position:absolute;opacity:0;pointer-events:none}
.check .box{width:19px;height:19px;flex:none;border:1.5px solid #cbd5e1;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
.check .box svg{opacity:0;transform:scale(.6);transition:all .2s;color:#fff;width:12px;height:12px}
.check input:checked + .box{background:var(--primary);border-color:var(--primary)}
.check input:checked + .box svg{opacity:1;transform:scale(1)}
.check a{color:var(--primary);font-weight:600}

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row .field{margin-bottom:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 22px;border-radius:12px;font-size:14.5px;font-weight:600;transition:all .22s var(--ease);white-space:nowrap}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.28)}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,185,129,.35)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn-ghost{background:#fff;border:1.5px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-50)}
.btn-danger{background:var(--red);color:#fff;border:none}
.btn-danger:hover{background:#dc2626;transform:translateY(-2px);box-shadow:0 8px 22px rgba(239,68,68,.35)}
.btn-gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;border:none}
.btn-gold:hover{background:linear-gradient(135deg,#f59e0b,#d97706);transform:translateY(-2px);box-shadow:0 8px 22px rgba(245,158,11,.35)}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px}
.btn-xs{padding:6px 10px;font-size:12px;border-radius:8px;gap:5px}
.btn-xs svg{width:13px;height:13px}
.divider{display:flex;align-items:center;gap:14px;color:var(--muted-2);font-size:13px;margin:22px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.oauth{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oauth button{display:flex;align-items:center;justify-content:center;gap:9px;padding:12px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-weight:600;transition:all .2s;background:#fff}
.oauth button:hover{border-color:#cbd5e1;background:#fafbfa;transform:translateY(-1px)}
.auth-note-bottom{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12.5px;margin-top:22px}
.auth-note-bottom svg{color:var(--primary);width:14px;height:14px}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;animation:fadeIn .35s ease}
.sidebar{background:#fff;border-right:1px solid var(--border-2);padding:22px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:24px}
.sidebar-brand .brand-logo{width:34px;height:34px}
.sidebar-brand .brand-name{font-size:19px;font-weight:800;letter-spacing:-.4px}
.sidebar-brand .brand-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.nav-sec{font-size:10.5px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;padding:14px 12px 6px}
.nav-sec.admin{color:var(--gold-dark)}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;font-size:14px;font-weight:500;color:#475569;transition:all .18s var(--ease);cursor:pointer;position:relative}
.nav-item svg{width:19px;height:19px;flex:none;transition:transform .2s}
.nav-item:hover{background:#f4f8f7;color:var(--text)}
.nav-item:hover svg{transform:scale(1.08)}
.nav-item.active{background:var(--primary-50);color:var(--primary-dark);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:4px;height:22px;background:var(--primary);border-radius:0 4px 4px 0}
.nav-item.admin{color:#92400e}
.nav-item.admin:hover{background:#fef3c7;color:#78350f}
.nav-item.admin.active{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#78350f}
.nav-item.admin.active::before{background:var(--gold)}
.nav-item .nav-badge{background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:auto;letter-spacing:.3px}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--border-2)}
.help-card{background:linear-gradient(150deg,#f0fdf8,#e6f9f1);border-radius:14px;padding:14px;margin-bottom:12px;transition:transform .3s var(--ease)}
.help-card:hover{transform:translateY(-3px)}
.help-card .hc-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.help-card .hc-icon{width:32px;height:32px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.help-card .hc-icon svg{width:16px;height:16px}
.help-card b{font-size:13px;display:block}
.help-card p{font-size:11.5px;color:var(--muted);line-height:1.45}
.help-card a{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--primary);font-weight:600;margin-top:8px;transition:gap .2s;cursor:pointer}
.help-card a svg{width:14px;height:14px}
.user-mini{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;transition:background .2s;cursor:pointer}
.user-mini:hover{background:#f4f8f7}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:var(--primary-dark);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.avatar.admin{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e}
.avatar .crown{position:absolute;top:-6px;right:-4px;font-size:14px;transform:rotate(15deg)}
.user-mini .um-info{flex:1;min-width:0}
.user-mini .um-info b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-mini .um-info span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.logout-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;font-size:14px;color:#475569;transition:all .2s;width:100%;text-align:left;font-weight:500}
.logout-btn svg{width:18px;height:18px}
.logout-btn:hover{background:var(--red-50);color:var(--red)}

.main{padding:24px 32px 0;max-width:1500px;width:100%;display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.topbar h1{font-size:26px;font-weight:800;letter-spacing:-.7px;display:flex;align-items:center;gap:10px}
.topbar .sub{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:640px}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.admin-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase;box-shadow:0 2px 8px rgba(245,158,11,.3)}

.search{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--border-2);border-radius:12px;padding:10px 12px 10px 14px;width:280px;transition:all .2s}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(16,185,129,.08)}
.search > svg{color:var(--muted-2);flex:none;transition:color .2s;width:17px;height:17px}
.search:focus-within > svg{color:var(--primary)}
.search input{border:none;background:transparent;flex:1;font-size:13.5px;outline:none;min-width:0;padding:2px 0}
.search-clear{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted-2);transition:all .18s var(--ease)}
.search-clear:hover{background:#eef4f1;color:var(--text);transform:scale(1.08)}
.search-clear svg{width:12px;height:12px}

.gsearch-panel{position:absolute;top:calc(100% + 8px);right:0;width:440px;max-width:calc(100vw - 40px);max-height:520px;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--border-2);z-index:100;animation:dropIn .2s var(--ease);padding:8px}
.gsearch-panel::before{content:'';position:absolute;top:-6px;right:26px;width:12px;height:12px;background:#fff;border-left:1px solid var(--border-2);border-top:1px solid var(--border-2);transform:rotate(45deg);border-radius:2px 0 0 0}
.gsearch-section{padding:6px 4px}
.gsearch-section + .gsearch-section{border-top:1px solid var(--border-2);margin-top:4px;padding-top:8px}
.gsearch-label{font-size:10.5px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;padding:4px 10px 8px;display:flex;align-items:center;gap:6px}
.gsearch-label span{color:var(--primary);background:var(--primary-50);padding:1px 7px;border-radius:10px;font-size:10px;letter-spacing:0}
.gsearch-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;cursor:pointer;transition:background .15s var(--ease)}
.gsearch-item:hover{background:#f4f8f7}
.gsearch-item:hover .gsi-arrow{opacity:1;transform:translateX(0)}
.gsearch-ico{width:38px;height:38px;border-radius:11px;background:var(--primary-50);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.gsearch-ico svg{width:17px;height:17px}
.gsearch-info{flex:1;min-width:0}
.gsearch-info b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsearch-info b mark{background:rgba(16,185,129,.25);color:var(--primary-dark);padding:0 2px;border-radius:3px}
.gsearch-info span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.gsi-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;font-weight:600}
.gsi-meta.pos{color:var(--primary-dark)}
.gsi-meta.neg{color:var(--text)}
.gsi-arrow{opacity:0;transform:translateX(-4px);transition:all .2s;color:var(--muted-2);flex:none}
.gsi-arrow svg{width:14px;height:14px}
.gsearch-empty{padding:32px 20px;text-align:center;color:var(--muted);font-size:13px}
.gsearch-empty b{display:block;font-size:14px;color:var(--text);margin-bottom:6px}
.gsearch-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 8px;margin-top:6px;border-top:1px solid var(--border-2);font-size:11.5px;color:var(--muted-2)}
.gsearch-footer kbd{background:#f4f8f7;border:1px solid var(--border-2);border-radius:5px;padding:2px 6px;font-family:inherit;font-size:11px;font-weight:600;color:#475569}

.chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--border-2);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:500;color:#475569;transition:all .2s}
.chip svg{width:16px;height:16px}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.icon-btn{width:42px;height:42px;border-radius:12px;background:#fff;border:1.5px solid var(--border-2);display:flex;align-items:center;justify-content:center;color:#475569;transition:all .2s;position:relative}

  border-radius:16px;border:1px solid #d1fae5;
}
.secure-note .sn-ico{
  width:44px;height:44px;border-radius:12px;background:#fff;color:var(--primary);
  display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:0 4px 14px rgba(16,185,129,.15);
}
.secure-note .sn-ico svg{width:20px;height:20px}
.secure-note b{display:block;font-size:14px;color:var(--primary-dark);margin-bottom:4px;font-weight:700}
.secure-note p{font-size:12.5px;color:#475569;line-height:1.55}

.card-syncing-overlay{
  position:absolute;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);

  border-radius:22px;z-index:5;animation:fadeIn .3s ease;color:#fff;
}
.card-syncing-overlay .spin{
  width:44px;height:44px;border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;
}
.card-syncing-overlay b{font-size:14px;font-weight:700}
.card-syncing-overlay p{font-size:12px;opacity:.85}

.row-actions{display:flex;gap:6px;justify-content:flex-end}

.row-actions button svg{width:14px;height:14px}
.row-actions button:hover{background:#fff;border-color:var(--primary);color:var(--primary)}
.row-actions button.danger:hover{background:var(--red-50);border-color:var(--red);color:var(--red)}

.role-select{display:flex;gap:8px}
.role-radio{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--border);background:#fbfdfc;cursor:pointer;font-size:13.5px;font-weight:600;transition:all .2s;position:relative}

/* ============================================================

   ============================================================ */
const Utils = {
  fmtMoney(n, withSign = false) {
    const sign = n > 0 && withSign ? '+' : (n < 0 ? '−' : '');
    const abs = Math.abs(Math.round(n));
    return sign + abs.toLocaleString('ru-RU').replace(/,/g,' ') + ' ₽';
  },
  fmtDateTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diffDays = Math.floor((now - d) / 86400000);
    const time = d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    if (diffDays === 0) return 'Сегодня, ' + time;
    if (diffDays === 1) return 'Вчера, '   + time;
    return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'}) + ', ' + time;
  },
  fmtDateShort(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});
  },
  monthFull(i) { return ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][i]; },
  monthName(i) { return ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'][i]; },
  uid() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); },
  escape(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  },
  initials(name) {
    if (!name) return '?';
    const p = name.trim().split(/\s+/);
    return ((p[0]||'')[0]||'') + ((p[1]||'')[0]||'');
  },
  highlight(text, query) {
    if (!query) return Utils.escape(text);
    const escaped = Utils.escape(text);
    const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try { return escaped.replace(new RegExp('(' + q + ')', 'gi'), '<mark>$1</mark>'); }
    catch (e) { return escaped; }
  },
  maskCardNumber(num) {
    const clean = String(num).replace(/\D/g,'');
    if (clean.length < 4) return clean;
    const last4 = clean.slice(-4);
    const first4 = clean.slice(0,4);
    return first4 + ' •••• •••• ' + last4;
  },
  detectCardSystem(num) {
    const c = String(num).replace(/\D/g,'');
    if (/^4/.test(c)) return 'visa';
    if (/^(5[1-5]|2[2-7])/.test(c)) return 'mastercard';
    if (/^220[0-4]/.test(c)) return 'mir';
    if (/^62/.test(c)) return 'unionpay';
    return 'visa';
  },
  toLocalDatetimeValue(date = new Date()) {
    const d = new Date(date);
    const pad = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) +
           'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  },
  localToISO(value) {
    if (!value) return new Date().toISOString();
    try { return new Date(value).toISOString(); }
    catch (e) { return new Date().toISOString(); }
  }
};

   ============================================================ */
const Finance = {
  computeStats(user) {
    if (!user.transactions || !user.transactions.length) {
      return { balance:0, incomeMonth:0, expenseMonth:0, income6m:0, expense6m:0, incomeDelta:0, expenseDelta:0, avgCheck:0, isEmpty:true };
    }
    const now = new Date();
    const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const prevMonthStart = new Date(now.getFullYear(), now.getMonth()-1, 1);
    let incomeMonth = 0, expenseMonth = 0, incomePrev = 0, expensePrev = 0;
    let income6m = 0, expense6m = 0;
    const sixAgo = new Date(now.getFullYear(), now.getMonth()-5, 1);
    for (const t of user.transactions) {
      const d = new Date(t.date);
      const amt = t.amount;
      if (d >= thisMonthStart) amt > 0 ? incomeMonth += amt : expenseMonth += -amt;
      if (d >= prevMonthStart && d < thisMonthStart) amt > 0 ? incomePrev += amt : expensePrev += -amt;
      if (d >= sixAgo) amt > 0 ? income6m += amt : expense6m += -amt;
    }
    const balance = user.transactions.reduce((s,t) => s + t.amount, 0);
    const expenseCount = user.transactions.filter(t => t.amount < 0 && new Date(t.date) >= sixAgo).length;
    const avgCheck = expenseCount ? expense6m / expenseCount : 0;
    return {
      balance, incomeMonth, expenseMonth, income6m, expense6m,
      incomeDelta: incomePrev ? Math.round((incomeMonth - incomePrev) / incomePrev * 100) : 0,
      expenseDelta: expensePrev ? Math.round((expenseMonth - expensePrev) / expensePrev * 100) : 0,
      avgCheck, isEmpty:false
    };
  },
  chartData(user, months = 6) {
    const now = new Date();
    const arr = [];
    for (let i = months - 1; i >= 0; i--) {
      const m = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const sum = (user.transactions || [])
        .filter(t => t.amount < 0 && new Date(t.date).getMonth() === m.getMonth() && new Date(t.date).getFullYear() === m.getFullYear())
        .reduce((s,t) => s + Math.abs(t.amount), 0);
      arr.push({ label: Utils.monthName(m.getMonth()), value: Math.round(sum) });
    }
    return arr;
  },
  categorySpending(user) {
    if (!user.transactions || !user.transactions.length) return [];
    const now = new Date();
    const m = new Date(now.getFullYear(), now.getMonth(), 1);
    const byCat = {};
    let total = 0;
    for (const t of user.transactions) {
      if (t.amount >= 0) continue;
      const d = new Date(t.date);
      if (d < m) continue;
      byCat[t.category] = (byCat[t.category] || 0) + Math.abs(t.amount);
      total += Math.abs(t.amount);
    }
    return Object.entries(byCat)
      .map(([name, amount]) => {
        const meta = CATEGORY_META[name] || { color:'#64748b', icon:'💰' };
        return { name, amount, color: meta.color, percent: total ? Math.round(amount / total * 100) : 0 };
      })
      .sort((a,b) => b.amount - a.amount)
      .slice(0, 5);
  },
  monthlyCompare(user) {
    const now = new Date();
    const arr = [];
    let max = 1;
    for (let i = 5; i >= 0; i--) {
      const m = new Date(now.getFullYear(), now.getMonth() - i, 1);
      let inc = 0, exp = 0;
      (user.transactions || []).forEach(t => {
        const d = new Date(t.date);
        if (d.getMonth() === m.getMonth() && d.getFullYear() === m.getFullYear()) {
          t.amount > 0 ? inc += t.amount : exp += -t.amount;
        }
      });
      max = Math.max(max, inc, exp);
      arr.push({ label: Utils.monthFull(m.getMonth()), income: inc, expense: exp });
    }
    return arr.map(x => ({
      ...x,
      incomePct:  Math.round(x.income  / max * 100),
      expensePct: Math.round(x.expense / max * 100)
    }));
  },
  filterTransactions(transactions, filter) {
    let list = [...(transactions||[])];
    if (filter.q && filter.q.trim()) {
      const q = filter.q.trim().toLowerCase();
      list = list.filter(t => {
        const haystack = [t.title || '', t.category || '', t.address || '', String(Math.abs(t.amount))].join(' ').toLowerCase();
        return haystack.includes(q);
      });
    }
    if (filter.type && filter.type !== 'all') list = list.filter(t => t.type === filter.type);
    return list;
  },
  globalSearch(user, query) {
    const q = query.trim().toLowerCase();
    if (!q) return { transactions:[], categories:[], goals:[], pages:[], cards:[] };
    const transactions = (user.transactions||[]).filter(t => {
      const hay = [t.title || '', t.category || '', t.address || '', String(Math.abs(t.amount))].join(' ').toLowerCase();
      return hay.includes(q);
    }).slice(0, 5);
    const categories = user.categories.filter(c => {
      const hay = [c.name || '', c.type === 'income' ? 'доход' : 'расход'].join(' ').toLowerCase();
      return hay.includes(q);
    }).slice(0, 4);
    const goals = (user.goals || []).filter(g => {
      const hay = [g.title || '', String(g.target || ''), String(g.current || '')].join(' ').toLowerCase();
      return hay.includes(q);
    }).slice(0, 4);
    const cards = (user.cards || []).filter(c => {
      const hay = [c.bank, c.system, c.last4, 'карта'].join(' ').toLowerCase();
      return hay.includes(q);
    }).slice(0, 3);
    const pages = PAGES_INDEX.filter(p => {
      if (p.id.startsWith('admin') && user.role !== 'admin') return false;
      const hay = [p.title || '', p.desc || '', p.id].join(' ').toLowerCase();
      return hay.includes(q);
    }).slice(0, 5);
    return { transactions, categories, goals, pages, cards };
  }
};

  login(email, password, remember) {
    this.ensureSeed();
    const user = this.findByEmail(email);
    if (!user) throw new Error('Пользователь с таким email не найден');
    if (user.password !== password) throw new Error('Неверный пароль');
    this._hydrate(user);
    this.setSession({ userId: user.id, at: Date.now(), remember: !!remember });
    return user;
  },

  register({ name, email, password }) {
    this.ensureSeed();
    if (this.findByEmail(email)) throw new Error('Пользователь с таким email уже существует');
    const user = {
      id:'u_'+Utils.uid(), name, email, phone:'', password, role:'user',
      createdAt: new Date().toISOString(), premium:false,
      transactions: [], cards: [],
      categories: DEFAULT_CATEGORIES.map(c => ({...c})),
      goals: NEW_USER_GOALS.map(g => ({...g})),
      notifications: DEFAULT_NOTIFICATIONS.map(n => ({...n})),
      settings: { currency:'RUB', notifications:true, email:true, goalReminders:true, theme:'light' }
    };
    // ВАЖНО: перечитываем свежий массив и сохраняем
    const freshUsers = this.getUsers();
    freshUsers.push(user);
    this.saveUsers(freshUsers);
    this.setSession({ userId: user.id, at: Date.now(), remember: true });
    return user;
  },

  logout() { this.clearSession(); },

  current() {
    const s = this.getSession();
    if (!s) return null;
    const u = this.getUsers().find(x => x.id === s.userId);
    if (!u) { this.clearSession(); return null; }
    this._hydrate(u);
    return u;
  },

  update(patch) {
    const s = this.getSession();
    if (!s) return null;
    const users = this.getUsers();
    const idx = users.findIndex(u => u.id === s.userId);
    if (idx < 0) return null;
    users[idx] = { ...users[idx], ...patch };
    this.saveUsers(users);
    return users[idx];
  },

  updateUser(userId, patch) {
    const users = this.getUsers();
    const idx = users.findIndex(u => u.id === userId);
    if (idx < 0) return null;
    users[idx] = { ...users[idx], ...patch };
    this.saveUsers(users);
    return users[idx];
  },

  deleteUser(userId) {
    const users = this.getUsers().filter(u => u.id !== userId);
    this.saveUsers(users);
  },

  createUserByAdmin({ name, email, password, role, premium }) {
    if (this.findByEmail(email)) throw new Error('Пользователь с таким email уже существует');
    const user = {
      id:'u_'+Utils.uid(), name, email, phone:'', password, role: role || 'user',
      createdAt: new Date().toISOString(), premium: !!premium,
      transactions: [], cards: [],
      categories: DEFAULT_CATEGORIES.map(c => ({...c})),
      goals: NEW_USER_GOALS.map(g => ({...g})),
      notifications: DEFAULT_NOTIFICATIONS.map(n => ({...n})),
      settings: { currency:'RUB', notifications:true, email:true, goalReminders:true, theme:'light' }
    };
    const freshUsers = this.getUsers();
    freshUsers.push(user);
    this.saveUsers(freshUsers);
    return user;
  },

  migrateAllUsers() {
    const users = this.getUsers();
    let changed = false;
    users.forEach(u => {
      if (!Array.isArray(u.categories)) return;
      const seen = new Set();
      const deduped = [];
      u.categories.forEach(c => {
        const key = (c.name || '').trim().toLowerCase() + '|' + (c.type || '');
        if (seen.has(key)) return;
        seen.add(key);
        deduped.push(c);
      });
      if (!deduped.find(c => (c.name||'').toLowerCase() === 'другое' && c.type === 'expense')) {
        deduped.push({ name:'Другое', budget:0, color:'#64748b', icon:'📦', type:'expense' });
      }
      if (!deduped.find(c => (c.name||'').toLowerCase() === 'другое' && c.type === 'income')) {
        deduped.push({ name:'Другое', budget:0, color:'#64748b', icon:'📦', type:'income' });
      }
      if (deduped.length !== u.categories.length) changed = true;
      u.categories = deduped;
    });
    if (changed) this.saveUsers(users);
  },

  _hydrate(user) {
    let changed = false;
    if (user.id === 'u_demo') {
      if (!user.transactions) { user.transactions = generateDemoTransactions(); changed = true; }
      if (!user.goals)        { user.goals = DEMO_GOALS.map(g => ({...g})); changed = true; }
      if (!user.notifications) { user.notifications = DEMO_NOTIFICATIONS.map(n => ({...n})); changed = true; }
      if (!user.categories)   { user.categories = DEFAULT_CATEGORIES.map(c => ({...c})); changed = true; }
    } else {
      if (!user.transactions)  { user.transactions = []; changed = true; }
      if (!user.categories)    { user.categories = DEFAULT_CATEGORIES.map(c => ({...c})); changed = true; }
      if (!user.goals)         { user.goals = NEW_USER_GOALS.map(g => ({...g})); changed = true; }
      if (!user.notifications) { user.notifications = DEFAULT_NOTIFICATIONS.map(n => ({...n})); changed = true; }
    }
    if (!user.cards)    { user.cards = []; changed = true; }
    if (!user.role)     { user.role = 'user'; changed = true; }
    if (!user.settings) { user.settings = { currency:'RUB', notifications:true, email:true, goalReminders:true, theme:'light' }; changed = true; }

    const seen = new Set();
    const deduped = [];
    (user.categories || []).forEach(c => {
      const key = (c.name || '').trim().toLowerCase() + '|' + (c.type || '');
      if (seen.has(key)) return;
      seen.add(key);
      deduped.push(c);
    });
    if (deduped.length !== (user.categories || []).length) {
      user.categories = deduped;
      changed = true;
    }

    if (!user.categories.find(c => (c.name||'').toLowerCase() === 'другое' && c.type === 'expense')) {
      user.categories.push({ name:'Другое', budget:0, color:'#64748b', icon:'📦', type:'expense' });
      changed = true;
    }
    if (!user.categories.find(c => (c.name||'').toLowerCase() === 'другое' && c.type === 'income')) {
      user.categories.push({ name:'Другое', budget:0, color:'#64748b', icon:'📦', type:'income' });
      changed = true;
    }

    if (changed) {
      const users = this.getUsers();
      const i = users.findIndex(u => u.id === user.id);
      if (i >= 0) { users[i] = user; this.saveUsers(users); }
    }
  },

  isAdmin(user) { return user && user.role === 'admin'; }
};

   7. CARDS
   ============================================================ */
const Cards = {
  add(user, { number, bank, system, expiry, holder, isDefault }) {
    const clean = String(number).replace(/\D/g,'');
    if (clean.length !== 16) throw new Error('Номер карты должен содержать 16 цифр');

    const cards = [...(user.cards||[])];
    if (isDefault) cards.forEach(c => c.isDefault = false);
    const card = {
      id: 'card_' + Utils.uid(),
      number: clean,
      last4: clean.slice(-4),
      bank: bank || 'Другой банк',
      system: system || Utils.detectCardSystem(clean),
      expiry: expiry || '',
      holder: holder || '',
      isDefault: cards.length === 0 ? true : !!isDefault,
      createdAt: new Date().toISOString(),
      lastSync: null,
      txCount: 0
    };
    cards.push(card);
    return cards;
  },

  remove(cards, id) {
    const filtered = cards.filter(c => c.id !== id);
    if (filtered.length && !filtered.some(c => c.isDefault)) {
      filtered[0] = { ...filtered[0], isDefault: true };
    }
    return filtered;
  },

  setDefault(cards, id) {
    return cards.map(c => ({ ...c, isDefault: c.id === id }));
  },

  simulateSync(user, cardId, days = 7) {
    const card = user.cards.find(c => c.id === cardId);
    if (!card) return [];
    const shops = [
      ['Питание', 'Пятёрочка', 250, 2400],
      ['Питание', 'Магнит', 180, 1800],
      ['Питание', 'ВкусВилл', 400, 1500],
      ['Питание', 'Кофейня «Солнечный день»', 150, 450],
      ['Транспорт', 'Яндекс.Такси', 200, 900],
      ['Транспорт', 'Метро', 60, 100],
      ['Развлечения', 'Кинотеатр', 350, 800],
      ['Развлечения', 'Netflix', 799, 799],
      ['Покупки', 'Ozon', 500, 4500],
      ['Покупки', 'Wildberries', 700, 3500],
      ['Здоровье', 'Аптека «Здоровье»', 300, 2000],
      ['Связь', 'МТС', 500, 900],
      ['Коммуналка', 'Мосэнерго', 1200, 3200]
    ];
    const now = new Date();
    const count = 3 + Math.floor(Math.random() * 4);
    const list = [];
    for (let i = 0; i < count; i++) {
      const [cat, title, min, max] = shops[Math.floor(Math.random()*shops.length)];
      const amount = -Math.round(min + Math.random() * (max - min));
      const d = new Date(now.getTime() - Math.floor(Math.random() * days * 86400000) - Math.floor(Math.random()*6*3600000));
      list.push({
        id: 'tx_' + Utils.uid(),
        title,
        category: cat,
        amount,
        type: 'expense',
        date: d.toISOString(),
        address: 'Оплата картой •••• ' + card.last4,
        cardId: card.id
      });
    }
    return list.sort((a,b) => new Date(b.date) - new Date(a.date));
  }
};

const Admin = {
  systemStats() {
    const users = Auth.getUsers();
    let totalTx = 0, totalBalance = 0, totalIncome = 0, totalExpense = 0, totalCards = 0;
    users.forEach(u => {
      const txs = u.transactions || [];
      totalTx += txs.length;
      totalCards += (u.cards||[]).length;
      txs.forEach(t => {
        totalBalance += t.amount;
        t.amount > 0 ? totalIncome += t.amount : totalExpense += -t.amount;
      });
    });
    return {
      totalUsers: users.length,
      totalTx,
      totalBalance,
      totalIncome,
      totalExpense,
      admins: users.filter(u => u.role === 'admin').length,
      premiums: users.filter(u => u.premium).length,
      totalCards
    };
  },
  registrationsChart() {
    const users = Auth.getUsers();
    const now = new Date();
    const arr = [];
    for (let i = 5; i >= 0; i--) {
      const m = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const count = users.filter(u => {
        const d = new Date(u.createdAt);
        return d.getMonth() === m.getMonth() && d.getFullYear() === m.getFullYear();
      }).length;
      arr.push({ label: Utils.monthName(m.getMonth()), value: count });
    }
    return arr;
  },

    return Auth.getUsers().map(u => ({
      id: u.id, name: u.name, email: u.email,
      role: u.role, premium: u.premium,

      <div class="footer-copy">© 2026 Финансист. Все права защищены.</div>
    </footer>`;
  },

  sidebar(user, active) {
    const isAdmin = user.role === 'admin';
    const cardCount = (user.cards || []).length;
    const items = [
      { id:'dashboard',    label:'Главная',      icon:'home' },
      { id:'transactions', label:'Операции',     icon:'swap' },
      { id:'cards',        label:'Мои карты',    icon:'creditCard', badge: cardCount || null },
      { id:'analytics',    label:'Аналитика',    icon:'chart' },
      { id:'categories',   label:'Категории',    icon:'grid' },
      { id:'settings',     label:'Настройки',    icon:'settings' }
    ];
    return `
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">${Icons.logo}</div>
        <div><div class="brand-name">Финансист</div><div class="brand-sub">Твои деньги под контролем</div></div>
      </div>
      <div class="nav-sec">Меню</div>
      ${items.map(i => `<a class="nav-item ${active===i.id?'active':''}" data-nav="${i.id}">${Icons[i.icon]}<span>${i.label}</span>${i.badge?`<span class="nav-badge">${i.badge}</span>`:''}</a>`).join('')}
      <div class="nav-sec">Аккаунт</div>
      <a class="nav-item ${active==='profile'?'active':''}" data-nav="profile">${Icons.user}<span>Личный кабинет</span></a>
      <a class="nav-item ${active==='support'?'active':''}" data-nav="support">${Icons.help}<span>Обратная связь</span></a>
      ${isAdmin ? `
        <div class="nav-sec admin">Администрирование</div>
        <a class="nav-item admin ${active==='admin'?'active':''}" data-nav="admin">${Icons.crown}<span>Админ-панель</span></a>
        <a class="nav-item admin ${active==='admin-users'?'active':''}" data-nav="admin-users">${Icons.users}<span>Пользователи</span></a>
      ` : ''}
      <div class="sidebar-foot">
        <div class="help-card">
          <div class="hc-head"><div class="hc-icon">${Icons.help}</div><b>Нужна помощь?</b></div>
          <p>Поддержка Финансиста поможет настроить категории и разобраться с отчётами.</p>
          <a data-nav="support">Написать в поддержку ${Icons.arrowRight}</a>
        </div>
        <div class="user-mini" data-nav="profile">
          <div class="avatar ${isAdmin?'admin':''}">${isAdmin?'<span class="crown">👑</span>':''}${Utils.escape(Utils.initials(user.name))}</div>
          <div class="um-info"><b>${Utils.escape(user.name)}</b><span>${isAdmin ? 'Администратор' : Utils.escape(user.email)}</span></div>
        </div>
        <button class="logout-btn" data-action="logout">${Icons.logout}<span>Выйти</span></button>
      </div>
    </aside>`;
  },

  topbar(title, sub, user, pageId) {
    const now = new Date();
    const unread = (user.notifications || []).filter(n => n.unread).length;
    const isAdmin = user.role === 'admin';
    const isGlobal = pageId !== 'transactions';
    const currentQ = isGlobal ? (App.state.globalQuery || '') : (App.state.txFilter.q || '');
    const searchHtml = `
      <div class="search-wrap">
        <label class="search">
          ${Icons.search}
          <input type="text" id="topSearchInput"
                 placeholder="${isGlobal ? 'Поиск по сайту…' : 'Поиск по операциям…'}"
                 value="${Utils.escape(currentQ)}"
                 autocomplete="off" spellcheck="false">
          ${currentQ ? `<button type="button" class="search-clear" data-action="clear-search">${Icons.x}</button>` : ''}
        </label>
        <div id="globalPanelMount"></div>
      </div>`;
    return `
    <div class="topbar">
      <div>
        <h1>${title} ${isAdmin && pageId.startsWith('admin') ? '<span class="admin-badge">👑 Админ</span>' : ''}</h1>
        ${sub?`<div class="sub">${sub}</div>`:''}
      </div>
      <div class="topbar-right">
        ${searchHtml}
        <button class="chip" data-nav="transactions">${Icons.calendar} ${Utils.monthFull(now.getMonth())} ${now.getFullYear()}</button>
        <button class="icon-btn" data-action="notifications" title="Уведомления">
          ${Icons.bell}
          ${unread ? '<span class="badge"></span>' : ''}
        </button>
        <div class="avatar-top ${isAdmin?'admin':''}" data-nav="profile" title="${isAdmin?'Администратор':Utils.escape(user.name)}">${Utils.escape(Utils.initials(user.name))}</div>
      </div>
    </div>`;
  },

  globalPanel(user, q) {
    const r = Finance.globalSearch(user, q);
    const total = r.transactions.length + r.categories.length + r.goals.length + r.pages.length + (r.cards||[]).length;
    if (!total) {
      return `<div class="gsearch-panel"><div class="gsearch-empty"><b>Ничего не найдено</b>По запросу «${Utils.escape(q)}» ничего нет</div></div>`;
    }
    const section = (label, count, html) =>
      `<div class="gsearch-section"><div class="gsearch-label">${label}${count?`<span>${count}</span>`:''}</div>${html}</div>`;
    let out = `<div class="gsearch-panel">`;
    if (r.pages.length) {
      out += section('Страницы', r.pages.length, r.pages.map(p => `
        <div class="gsearch-item" data-nav="${p.id}">
          <div class="gsearch-ico">${Icons[p.icon] || Icons.compass}</div>
          <div class="gsearch-info"><b>${Utils.highlight(p.title, q)}</b><span>${Utils.escape(p.desc)}</span></div>
          <div class="gsi-arrow">${Icons.arrowRight}</div>
        </div>`).join(''));
    }
    if ((r.cards||[]).length) {
      out += section('Карты', r.cards.length, r.cards.map(c => `
        <div class="gsearch-item" data-nav="cards">
          <div class="gsearch-ico">${Icons.creditCard}</div>
          <div class="gsearch-info"><b>${Utils.escape(c.bank)} · ${Utils.escape(c.system.toUpperCase())}</b><span>•••• ${Utils.escape(c.last4)}</span></div>
          <div class="gsi-arrow">${Icons.arrowRight}</div>
        </div>`).join(''));
    }
    if (r.transactions.length) {
      out += section('Операции', r.transactions.length, r.transactions.map(t => {
        const meta = CATEGORY_META[t.category] || { color:'#64748b', icon:'💰' };
        return `<div class="gsearch-item" data-tx="${t.id}">
          <div class="gsearch-ico" style="background:${meta.color}1a;color:${meta.color}">${meta.icon}</div>
          <div class="gsearch-info"><b>${Utils.highlight(t.title, q)}</b><span>${Utils.escape(t.category)} · ${Utils.fmtDateTime(t.date)}</span></div>
          <div class="gsi-meta ${t.amount>0?'pos':'neg'}">${Utils.fmtMoney(t.amount, true)}</div>
        </div>`;
      }).join(''));
    }
    if (r.categories.length) {
      out += section('Категории', r.categories.length, r.categories.map(c => `
        <div class="gsearch-item" data-nav="categories">
          <div class="gsearch-ico" style="background:${c.color}1a;color:${c.color}">${c.icon}</div>
          <div class="gsearch-info"><b>${Utils.highlight(c.name, q)}</b><span>${c.type==='income'?'Доходы':'Расходы'}${c.budget?' · бюджет '+Utils.fmtMoney(c.budget):''}</span></div>
          <div class="gsi-arrow">${Icons.arrowRight}</div>
        </div>`).join(''));
    }
    if (r.goals.length) {
      out += section('Цели', r.goals.length, r.goals.map(g => {
        const pct = g.target ? Math.min(100, Math.round(g.current / g.target * 100)) : 0;
        return `<div class="gsearch-item" data-nav="profile">
          <div class="gsearch-ico">${Icons.target}</div>
          <div class="gsearch-info"><b>${Utils.highlight(g.title, q)}</b><span>${Utils.fmtMoney(g.current)} из ${Utils.fmtMoney(g.target)}</span></div>
          <div class="gsi-meta pos">${pct}%</div>
        </div>`;
      }).join(''));
    }
    out += `<div class="gsearch-footer"><span>Найдено: <b>${total}</b></span><span><kbd>Enter</kbd> — к операциям · <kbd>Esc</kbd> — закрыть</span></div></div>`;
    return out;
  },

  dashboard(user) {
    const s = Finance.computeStats(user);
    const chart = Finance.chartData(user, 6);
    const cats = Finance.categorySpending(user);
    const recent = (user.transactions || []).slice(0, 5);
    const goals = user.goals || [];
    const cards = user.cards || [];
    const isEmpty = s.isEmpty;

    if (isEmpty) {
      return `
        ${this.topbar('Привет, ' + Utils.escape(user.name.split(' ')[0]) + '!', 'Добро пожаловать в Финансист. Начните с первой операции', user, 'dashboard')}
        <div class="card fade-up" style="margin-bottom:18px">
          <div class="empty-new">
            <div class="en-ico">🌱</div>
            <h3>Ваш финансовый путь начинается здесь</h3>
            <p>У вас пока нет ни одной операции. Добавьте первый доход или расход — или привяжите банковскую карту, чтобы операции загружались автоматически.</p>
            <div class="hint-row">
              <span class="hint">💼 Добавьте зарплату</span>
              <span class="hint">💳 Привяжите карту</span>
              <span class="hint">🎯 Поставьте цель</span>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px">
              <button class="btn btn-primary" data-action="add-tx">${Icons.plus} Добавить операцию</button>
              <button class="btn btn-ghost" data-nav="cards">${Icons.creditCard} Привязать карту</button>
            </div>
          </div>
        </div>
        <div class="grid grid-3" style="margin-bottom:18px">
          <div class="stat green fade-up d1"><div class="stat-label">Баланс</div><div class="stat-value">0 ₽</div><div class="stat-delta" style="color:var(--muted)">Нет операций</div></div>
          <div class="stat blue fade-up d2"><div class="stat-label">Доходы за месяц</div><div class="stat-value">0 ₽</div></div>
          <div class="stat red fade-up d3"><div class="stat-label">Расходы за месяц</div><div class="stat-value">0 ₽</div></div>
        </div>
        ${this.footer()}`;
    }

    return `
      ${this.topbar('Привет, ' + Utils.escape(user.name.split(' ')[0]) + '!', 'Вот как обстоят дела с твоими финансами сегодня', user, 'dashboard')}
      <div class="grid grid-3" style="margin-bottom:18px">
        <div class="stat green fade-up">
          <div class="stat-icon">${Icons.wallet}</div>
          <div class="stat-label">Баланс</div>
          <div class="stat-value">${Utils.fmtMoney(s.balance)}</div>
          <div class="stat-delta">${Icons.trendUp} ${Utils.fmtMoney(s.incomeMonth - s.expenseMonth, true)} за месяц</div>
        </div>
        <div class="stat blue fade-up d1">
          <div class="stat-icon">${Icons.trendUp}</div>
          <div class="stat-label">Доходы за месяц</div>
          <div class="stat-value">${Utils.fmtMoney(s.incomeMonth)}</div>
          <div class="stat-delta">${Icons.trendUp} +${s.incomeDelta}% к прошлому</div>
        </div>
        <div class="stat red fade-up d2">
          <div class="stat-icon">${Icons.trendDown}</div>
          <div class="stat-label">Расходы за месяц</div>
          <div class="stat-value">${Utils.fmtMoney(s.expenseMonth)}</div>
          <div class="stat-delta">${Icons.trendUp} +${s.expenseDelta}% к прошлому</div>
        </div>
      </div>
      <div class="actions fade-up d2" style="margin-bottom:22px">
        <button class="btn btn-primary" data-action="add-tx">${Icons.plus} Добавить операцию</button>
        <button class="btn btn-ghost" data-nav="cards">${Icons.creditCard} Мои карты${cards.length?` · ${cards.length}`:''}</button>
        <button class="btn btn-ghost" data-nav="analytics">Посмотреть аналитику</button>
      </div>
      <div class="grid grid-main" style="margin-bottom:18px">
        <div class="card fade-up d3">
          <div class="card-head"><h3>Динамика расходов</h3><span style="font-size:12.5px;color:var(--muted)">за последние 6 месяцев</span></div>
          ${this._lineChart(chart)}
        </div>
        <div class="card fade-up d4">
          <div class="card-head"><h3>Траты по категориям</h3></div>
          ${cats.length ? cats.map(c => `
            <div class="cat-row">
              <div class="cat-top"><span class="cat-name"><span class="cat-dot" style="background:${c.color}"></span>${c.name}</span><span class="cat-values">${Utils.fmtMoney(c.amount)} <b>${c.percent}%</b></span></div>
              <div class="bar-bg"><div class="bar-fill" style="width:${c.percent}%;background:${c.color}"></div></div>
            </div>`).join('') : this._empty('Пока нет трат')}
        </div>
      </div>
      <div class="grid grid-2-1" style="margin-bottom:18px">
        <div class="card fade-up d4">
          <div class="card-head"><h3>Недавние операции</h3><span class="link" data-nav="transactions">Все →</span></div>
          <div class="tx-list">${recent.length ? recent.map(tx => this._txRow(tx)).join('') : this._empty('Нет операций')}</div>
        </div>
        <div class="card fade-up d5">
          <div class="card-head"><h3>Цели на месяц</h3><span class="link" data-action="add-goal">+ Добавить</span></div>
          ${goals.slice(0,3).map(g => this._goalCard(g)).join('') || '<p style="color:var(--muted);font-size:13.5px">Пока нет целей</p>'}
          <div class="fast-reply" style="margin-top:18px">
            <div style="display:flex;gap:10px;margin-bottom:8px;position:relative;z-index:1">
              <div style="width:36px;height:36px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--primary)">${Icons.bolt}</div>
              <b>Совет от Финансиста</b>
            </div>
            <p>Старайтесь откладывать хотя бы 10% от дохода — это поможет реализовать большие цели!</p>
            <button class="btn btn-primary" data-nav="cards" style="margin-top:12px;padding:10px 16px;font-size:13px;position:relative;z-index:1">${Icons.creditCard} Привязать карту</button>
            <div class="plant">🌿</div>
          </div>
        </div>
      </div>
      ${this.footer()}`;
  },

  _goalCard(g) {
    const pct = g.target ? Math.min(100, Math.round(g.current / g.target * 100)) : 0;
    const done = g.current >= g.target;
    return `<div class="goal-card">
      <div class="goal-head">
        <b>${done ? '✅ ' : ''}${Utils.escape(g.title)}</b>
        <div class="goal-actions">
          <button class="btn btn-primary btn-xs" data-action="goal-deposit" data-goal-id="${g.id}" title="Пополнить">${Icons.plus} Пополнить</button>
          <button class="btn btn-ghost btn-xs" data-action="goal-edit" data-goal-id="${g.id}" title="Редактировать">${Icons.edit}</button>
          <button class="btn btn-ghost btn-xs" data-action="goal-delete" data-goal-id="${g.id}" title="Удалить" style="color:var(--red);border-color:var(--red)">${Icons.trash}</button>
        </div>
      </div>
      <div class="goal-bar"><div style="width:${pct}%"></div></div>
      <div class="goal-foot">
        <div class="goal-amounts">
          <span class="cur">${Utils.fmtMoney(g.current)}</span>
          <span class="total">из ${Utils.fmtMoney(g.target)}</span>
        </div>
        <span class="deadline">${Icons.calendar} ${new Date(g.deadline).toLocaleDateString('ru-RU')} · <b>${pct}%</b></span>
      </div>
    </div>`;
  },

  _lineChart(data) {
    const json = JSON.stringify(data).replace(/'/g, '&#39;');
    return `<div class="chart-wrap" data-chart='${json}'></div>`;
  },

  _txRow(tx, query) {
    const meta = CATEGORY_META[tx.category] || { color:'#64748b', icon:'💰' };
    const isPos = tx.amount > 0;
    const titleHtml = query ? Utils.highlight(tx.title, query) : Utils.escape(tx.title);
    let cardTag = '';
    if (tx.cardId) {
      const last4 = Utils.escape((tx.address||'').split('•••• ')[1] || '');
      cardTag = isPos
        ? `<span class="tx-card-tag in">⬇ ${last4}</span>`
        : `<span class="tx-card-tag">💳 ${last4}</span>`;
    }
    return `
    <div class="tx" data-tx="${tx.id}">
      <div class="tx-ico" style="background:${meta.color}1a;color:${meta.color}">${meta.icon}</div>
      <div class="tx-info"><b>${titleHtml}${cardTag}</b><span>${Utils.escape(tx.address || tx.category)} · ${Utils.fmtDateTime(tx.date)}</span></div>
      <div class="tx-amt ${isPos?'pos':'neg'}">${Utils.fmtMoney(tx.amount, true)}</div>
    </div>`;
  },

  _empty(text, sub = '') {
    return `<div class="empty"><div class="em-ico">📊</div><b>${text}</b>${sub?`<p>${sub}</p>`:''}</div>`;
  },

  transactions(user, filter = {}) {
    const list = Finance.filterTransactions(user.transactions, filter);
    const perPage = 12;
    const page = filter.page || 1;
    const totalPages = Math.max(1, Math.ceil(list.length / perPage));
    const pg = Math.min(page, totalPages);
    const slice = list.slice((pg-1)*perPage, pg*perPage);
    const q = filter.q || '';
    const isSearching = !!q.trim();
    const hasAny = (user.transactions||[]).length > 0;

    return `
      ${this.topbar('Операции', 'Все движения по вашему счёту', user, 'transactions')}
      <div class="card fade-up">
        <div class="card-head">
          <h3>
            ${isSearching ? 'Результаты поиска' : 'Все операции'}
            <span style="color:var(--muted);font-weight:500;font-size:13px">· ${list.length}</span>
            ${isSearching ? `<span style="color:var(--muted);font-weight:500;font-size:13px"> по запросу «${Utils.escape(q)}»</span>` : ''}
          </h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${isSearching ? `<button class="btn btn-ghost btn-sm" data-action="clear-search">${Icons.x} Сбросить поиск</button>` : ''}
            <button class="btn btn-ghost btn-sm" data-action="export">${Icons.download} Экспорт</button>
            <button class="btn btn-primary btn-sm" data-action="add-tx">${Icons.plus} Добавить</button>
          </div>
        </div>
        <div class="filter-row">
          ${['all','income','expense'].map(t => `<button class="filter-chip ${(filter.type||'all')===t?'active':''}" data-filter-type="${t}">${t==='all'?'Все':t==='income'?'Доходы':'Расходы'}</button>`).join('')}
        </div>
        ${!hasAny ? `
          <div class="empty-new">
            <div class="en-ico">📭</div>
            <h3>Операций пока нет</h3>
            <p>Добавьте первую операцию вручную или привяжите карту для автосинхронизации.</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px">
              <button class="btn btn-primary" data-action="add-tx">${Icons.plus} Добавить</button>
              <button class="btn btn-ghost" data-nav="cards">${Icons.creditCard} Привязать карту</button>
            </div>
          </div>
        ` : `
        <div style="overflow-x:auto">
          <table class="table">
            <thead><tr><th>Операция</th><th>Категория</th><th>Дата</th><th style="text-align:right">Сумма</th></tr></thead>
            <tbody>
              ${slice.length ? slice.map(tx => {
                const meta = CATEGORY_META[tx.category] || { color:'#64748b', icon:'💰' };
                const titleHtml = isSearching ? Utils.highlight(tx.title, q) : Utils.escape(tx.title);
                const catHtml = isSearching ? Utils.highlight(tx.category, q) : Utils.escape(tx.category);
                const addrHtml = isSearching ? Utils.highlight(tx.address||'', q) : Utils.escape(tx.address||'');
                const tag = tx.cardId
                  ? `<span class="tx-card-tag ${tx.amount > 0 ? 'in' : ''}">${tx.amount > 0 ? '⬇' : '💳'}</span>`
                  : '';
                return `<tr data-tx="${tx.id}" class="clickable">
                  <td>
                    <div style="display:flex;align-items:center;gap:10px">
                      <div class="tx-ico" style="width:36px;height:36px;background:${meta.color}1a;color:${meta.color};font-size:15px">${meta.icon}</div>
                      <div><div style="font-weight:600">${titleHtml}${tag}</div><div style="font-size:12px;color:var(--muted)">${addrHtml}</div></div>
                    </div>
                  </td>
                  <td><span style="display:inline-block;padding:4px 10px;border-radius:8px;background:${meta.color}1a;color:${meta.color};font-size:12px;font-weight:600">${catHtml}</span></td>
                  <td style="color:var(--muted)">${Utils.fmtDateTime(tx.date)}</td>
                  <td style="text-align:right;font-weight:700;color:${tx.amount>0?'var(--primary-dark)':'var(--text)'}">${Utils.fmtMoney(tx.amount, true)}</td>
                </tr>`;
              }).join('') : `<tr><td colspan="4">${this._empty(
                isSearching ? `Ничего не найдено по запросу «${Utils.escape(q)}»` : 'Ничего не найдено',
                isSearching ? 'Попробуйте изменить запрос или сбросить фильтры' : 'Попробуйте изменить фильтры'
              )}</td></tr>`}
            </tbody>
          </table>
        </div>
        ${totalPages > 1 ? `<div class="pagination">
          <button class="page-btn" data-page="${pg-1}" ${pg<=1?'disabled':''}>←</button>
          ${Array.from({length: totalPages}, (_,i) => i+1).map(n => `<button class="page-btn ${n===pg?'active':''}" data-page="${n}">${n}</button>`).join('')}
          <button class="page-btn" data-page="${pg+1}" ${pg>=totalPages?'disabled':''}>→</button>
        </div>` : ''}`}
      </div>
      ${this.footer()}`;
  },

  cards(user) {
    const cards = user.cards || [];
    return `
      ${this.topbar('Мои карты', 'Привяжите банковские карты для автоматической синхронизации покупок', user, 'cards')}
      <div class="cards-grid" id="cardsGrid">
        ${cards.length ? cards.map((c, i) => this._renderBankCard(c, i)).join('') : ''}

      ${cards.length ? `

          <div class="stat green fade-up">
            <div class="stat-icon">${Icons.creditCard}</div>
            <div class="stat-label">Привязано карт</div>
            <div class="stat-value">${cards.length}</div>

      <div class="secure-note fade-up d3">
        <div class="sn-ico">${Icons.shield}</div>
        <div style="flex:1">
          <b>Безопасность ваших данных</b>

      ${cards.length ? `

          <div class="card-head"><h3>Операции с привязанных карт</h3><span class="link" data-nav="transactions">Все →</span></div>

  },

  _renderBankCard(card, i) {
    const num = Utils.maskCardNumber(card.number);
    const sysClass = card.system || 'visa';
    return `
      <div>
        <div class="bank-card ${sysClass}" data-card="${card.id}" style="animation-delay:${i*0.06}s">
          <div class="bc-top">
            <div class="bc-chip"></div>
            <div class="bc-brand">${sysClass.toUpperCase()}</div>
          </div>
          <div class="bc-number">${num}</div>
          <div class="bc-bottom">
            <div>
              <div class="bc-label">Владелец</div>
              <div class="bc-value">${Utils.escape(card.holder || 'CARD HOLDER')}</div>
            </div>
            <div>
              <div class="bc-label">Срок</div>
              <div class="bc-value">${Utils.escape(card.expiry || '••/••')}</div>
            </div>
            <div class="bc-bank-logo">${Utils.escape(card.bank)}</div>
          </div>
        </div>
        <div class="card-info">
          <div class="card-meta">
            <span>${Icons.calendar} ${Utils.fmtDateShort(card.createdAt)}</span>
            ${card.lastSync ? `<span>${Icons.refresh} ${Utils.fmtDateTime(card.lastSync)}</span>` : ''}
            ${card.isDefault ? `<span style="color:var(--primary);font-weight:700">${Icons.check} Основная</span>` : ''}
          </div>
          <div class="card-actions">
            <button class="btn btn-primary btn-sm" data-action="sync-card" data-card-id="${card.id}">
              ${Icons.refresh} Синхронизировать
            </button>
            ${!card.isDefault ? `<button class="btn btn-ghost btn-sm" data-action="default-card" data-card-id="${card.id}">${Icons.star} Основная</button>` : ''}
            <button class="btn btn-ghost btn-sm" data-action="delete-card" data-card-id="${card.id}" style="color:var(--red);border-color:var(--red)">${Icons.trash}</button>
          </div>
        </div>
      </div>`;
  },

  _lastSyncText(cards) {
    const synced = cards.filter(c => c.lastSync).map(c => new Date(c.lastSync).getTime());
    if (!synced.length) return 'Ещё не было';
    const latest = new Date(Math.max(...synced));
    const now = new Date();
    const diffH = Math.floor((now - latest) / 3600000);
    if (diffH < 1) return 'Только что';
    if (diffH < 24) return diffH + ' ч назад';
    return Math.floor(diffH/24) + ' дн назад';
  },

    const s = Finance.computeStats(user);
    const hasData = !s.isEmpty;
    const chart = Finance.chartData(user, 6);
    const cats = Finance.categorySpending(user);

    return `

      ${!hasData ? `
        <div class="card fade-up"><div class="empty-new">
          <div class="en-ico">📊</div>
          <h3>Аналитика появится после первой операции</h3>
          <p>Как только вы добавите доходы и расходы, здесь появятся графики, разбор по категориям и сравнение месяцев.</p>

        </div></div>
      ` : `
      <div class="grid grid-3" style="margin-bottom:18px">
        <div class="stat green fade-up"><div class="stat-label">Всего доходов (6 мес)</div><div class="stat-value">${Utils.fmtMoney(s.income6m)}</div></div>
        <div class="stat red fade-up d1"><div class="stat-label">Всего расходов (6 мес)</div><div class="stat-value">${Utils.fmtMoney(s.expense6m)}</div></div>

        ${this._lineChart(chart)}
      </div>
      <div class="grid grid-2" style="margin-bottom:18px">

          <div class="card-head"><h3>Категории расходов</h3></div>
          ${cats.length ? cats.map(c => `
            <div class="cat-row">
              <div class="cat-top"><span class="cat-name"><span class="cat-dot" style="background:${c.color}"></span>${c.name}</span><span class="cat-values">${Utils.fmtMoney(c.amount)} <b>${c.percent}%</b></span></div>
              <div class="bar-bg"><div class="bar-fill" style="width:${c.percent}%;background:${c.color}"></div></div>
            </div>`).join('') : this._empty('Нет данных')}
        </div>
        <div class="card fade-up d4">
          <div class="card-head"><h3>Сравнение по месяцам</h3></div>
          ${monthly.map(m => `
            <div class="cat-row">
              <div class="cat-top"><span class="cat-name">${m.label}</span><span class="cat-values">${Utils.fmtMoney(m.income)} <b style="color:var(--red)">−${Utils.fmtMoney(m.expense)}</b></span></div>
              <div class="bar-bg" style="height:10px;display:flex;gap:2px;background:transparent">
                <div style="flex:1;background:#eef4f1;border-radius:5px;overflow:hidden"><div style="height:100%;width:${m.incomePct}%;background:var(--primary);animation:growBar 1s var(--ease) both"></div></div>
                <div style="flex:1;background:#eef4f1;border-radius:5px;overflow:hidden"><div style="height:100%;width:${m.expensePct}%;background:var(--red);animation:growBar 1s var(--ease) both"></div></div>
              </div>
            </div>`).join('')}
        </div>
      </div>`}
      ${this.footer()}`;
  },

  categories(user) {
    const expense = user.categories.filter(c => c.type === 'expense');
    const income = user.categories.filter(c => c.type === 'income');
    const spendMap = Object.fromEntries(Finance.categorySpending(user).map(s => [s.name, s]));
    const renderCat = (c) => {
      const s = spendMap[c.name];
      const used = s ? s.amount : 0;
      const pct = c.budget ? Math.min(100, Math.round(used / c.budget * 100)) : 0;
      return `<div class="cat-row" style="padding:14px;background:#fbfdfc;border-radius:12px;margin-bottom:10px">
        <div class="cat-top">
          <span class="cat-name"><span class="cat-dot" style="background:${c.color}"></span>${Utils.escape(c.name)}</span>
          <span class="cat-values">${c.budget ? Utils.fmtMoney(used)+' из '+Utils.fmtMoney(c.budget) : Utils.fmtMoney(used)} ${c.budget ? `<b>${pct}%</b>` : ''}</span>
        </div>
        ${c.budget ? `<div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${c.color}"></div></div>` : ''}
      </div>`;
    };
    return `
      ${this.topbar('Категории', 'Управляйте бюджетом по категориям', user, 'categories')}

        <div class="card fade-up d1">
          <div class="card-head"><h3>Доходы</h3><button class="btn btn-ghost btn-sm" data-action="add-cat" data-cat-type="income">${Icons.plus} Добавить</button></div>
          ${income.map(renderCat).join('')}
        </div>
      </div>
      ${this.footer()}`;
  },

              <div class="tx-info"><b>${Utils.escape(u.name)} ${isAdm?'👑':''}${u.premium && !isAdm?' ⭐':''}</b><span>${u.txCount} операций · ${u.cardsCount} карт</span></div>
              <div class="tx-amt ${u.balance>=0?'pos':'neg'}">${Utils.fmtMoney(u.balance)}</div>
