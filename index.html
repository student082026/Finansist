            <button class="btn btn-gold btn-sm" data-action="admin-export-excel" style="justify-content:flex-start;color:#fff">${Icons.download} Отчёт в Excel</button>
            <button class="btn btn-gold btn-sm" data-action="admin-export-word" style="justify-content:flex-start;color:#fff">${Icons.download} Отчёт в Word</button>
          </div>
        </div>
        <div class="card fade-up d6">
          <div class="card-head"><h3>Информация</h3></div>
          <div style="font-size:12.5px;color:var(--muted);line-height:1.7">
            <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Версия</span><b style="color:var(--text)">2.0.0</b></div>
            <div style="display:flex;justify-content:space-between;padding:4px 0"><span>База</span><b style="color:var(--text)">localStorage</b></div>
            <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Пользователей</span><b style="color:var(--text)">${s.totalUsers}</b></div>
            <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Операций</span><b style="color:var(--text)">${s.totalTx}</b></div>
          </div>
        </div>
      </div>
      ${this.footer()}`;
  },

  adminUsers(user, filter = {}) {
    if (user.role !== 'admin') {
      return `${this.topbar('Доступ запрещён', '', user, 'admin-users')}<div class="card fade-up"><div class="empty-new"><div class="en-ico">🔒</div><h3>Доступ только для администраторов</h3></div></div>`;
    }
    const all = Auth.getUsers();
    const q = (filter.q || '').trim().toLowerCase();
    let list = all;
    if (q) list = list.filter(u => (u.name||'').toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q));
    return `
      ${this.topbar('Пользователи', 'Управление всеми зарегистрированными аккаунтами', user, 'admin-users')}
      <div class="card fade-up">
        <div class="card-head">
          <h3>Всего <span style="color:var(--muted);font-weight:500;font-size:13px">· ${list.length}</span></h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" data-action="admin-export">${Icons.download} JSON</button>
            <button class="btn btn-gold btn-sm" data-action="admin-export-excel" style="color:#fff">${Icons.download} Excel</button>
            <button class="btn btn-gold btn-sm" data-action="admin-export-word" style="color:#fff">${Icons.download} Word</button>
            <button class="btn btn-primary btn-sm" data-action="admin-create-user">${Icons.plus} Новый</button>
          </div>
        </div>
        <div class="filter-row">
          <label class="search" style="width:300px">${Icons.search}<input type="text" placeholder="Поиск по имени или email…" data-admin-search value="${Utils.escape(filter.q||'')}"></label>
        </div>
        <div style="overflow-x:auto">
          <table class="table">
            <thead><tr><th>Пользователь</th><th>Роль</th><th>Операций</th><th>Карт</th><th>Баланс</th><th style="text-align:right">Действия</th></tr></thead>
            <tbody>
              ${list.length ? list.map(u => {
                const txCount = (u.transactions||[]).length;
                const balance = (u.transactions||[]).reduce((s,t) => s + t.amount, 0);
                const cardsCount = (u.cards||[]).length;
                const isSelf = u.id === user.id;
                return `<tr>
                  <td><div class="user-row">
                    <div class="avatar ${u.role==='admin'?'admin':''}">${u.role==='admin'?'👑':''}${Utils.escape(Utils.initials(u.name))}</div>
                    <div class="ur-info"><b>${Utils.escape(u.name)} ${u.premium?'⭐':''}${isSelf?' <span style="color:var(--muted);font-weight:400;font-size:11px">(вы)</span>':''}</b><span>${Utils.escape(u.email)}</span></div>
                  </div></td>
                  <td>${u.role==='admin'?'<span class="role-tag admin">Админ</span>':'<span class="role-tag user">Юзер</span>'}${u.premium?' <span class="role-tag premium">⭐</span>':''}</td>
                  <td style="font-weight:600">${txCount}</td>
                  <td style="font-weight:600">${cardsCount}</td>
                  <td style="font-weight:700;color:${balance>=0?'var(--primary-dark)':'var(--red)'}">${Utils.fmtMoney(balance)}</td>
                  <td><div class="row-actions">
                    <button title="Редактировать" data-admin-edit="${u.id}">${Icons.edit}</button>
                    <button title="Сменить роль" data-admin-role="${u.id}">${Icons.shieldAdmin}</button>
                    ${!isSelf ? `<button title="Удалить" class="danger" data-admin-delete="${u.id}">${Icons.trash}</button>` : ''}
                  </div></td>
                </tr>`;
              }).join('') : `<tr><td colspan="6"><div class="empty" style="padding:30px"><div class="em-ico">🔍</div><b>Не найдено</b></div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
      ${this.footer()}`;
  }
};

/* ============================================================
   10. APP
   ============================================================ */
const App = {
  state: {
    route: 'dashboard',
    txFilter: { type:'all', q:'', page:1 },
    globalQuery: '',
    adminUserFilter: ''
  },
  _searchTimer: null,

  init() {
    this.bindGlobal();
    Auth.ensureSeed();
    Auth.migrateAllUsers();
    this.render();
    window.addEventListener('resize', () => this.renderCharts());
  },

  parseHash() { return location.hash.replace('#','') || ''; },

  go(route) {
    if (route !== 'transactions') { this.state.txFilter.q = ''; this.state.txFilter.page = 1; }
    if (route === 'transactions') this.state.globalQuery = '';
    location.hash = route;
  },

  render() {
    const session = Auth.getSession();
    const hash = this.parseHash();
    const root = document.getElementById('root');
    if (!session) {
      const mode = (hash === 'register') ? 'register' : 'login';
      root.innerHTML = Pages.auth(mode);
      this.attachAuth();
      return;
    }
    const user = Auth.current();
    if (!user) { Auth.logout(); return this.render(); }
    const page = hash || 'dashboard';
    const validPages = ['dashboard','transactions','cards','analytics','categories','settings','profile','support','admin','admin-users'];
    const route = validPages.includes(page) ? page : 'dashboard';
    this.state.route = route;
    let content = '';
    switch (route) {
      case 'dashboard':    content = Pages.dashboard(user); break;
      case 'transactions': content = Pages.transactions(user, this.state.txFilter); break;
      case 'cards':        content = Pages.cards(user); break;
      case 'analytics':    content = Pages.analytics(user); break;
      case 'categories':   content = Pages.categories(user); break;
      case 'settings':     content = Pages.settings(user); break;
      case 'profile':      content = Pages.profile(user); break;
      case 'support':      content = Pages.support(user); break;
      case 'admin':        content = Pages.admin(user); break;
      case 'admin-users':  content = Pages.adminUsers(user, { q: this.state.adminUserFilter }); break;
    }
    root.innerHTML = `<div class="app">${Pages.sidebar(user, route)}<main class="main">${content}</main></div>`;
    this.attachApp(user);
    this.renderCharts();
    if (route !== 'transactions' && this.state.globalQuery) this.updateGlobalPanel(user);
  },

  updateGlobalPanel(user) {
    const mount = document.getElementById('globalPanelMount');
    if (!mount) return;
    if (!this.state.globalQuery) { mount.innerHTML = ''; return; }
    mount.innerHTML = Pages.globalPanel(user, this.state.globalQuery);
  },

  renderCharts() {
    requestAnimationFrame(() => {
      document.querySelectorAll('.chart-wrap[data-chart]').forEach(el => {
        let data;
        try { data = JSON.parse(el.getAttribute('data-chart')); }
        catch (e) { return; }
        if (!Array.isArray(data) || !data.length) return;
        this.buildChart(el, data);
      });
    });
  },

  buildChart(el, data) {
    const W = Math.max(el.clientWidth || 700, 300);
    const H = el.clientHeight || 280;
    const pad = { l: 46, r: 16, t: 16, b: 34 };
    const innerW = W - pad.l - pad.r;
    const innerH = H - pad.t - pad.b;
    const max = Math.max(...data.map(d => d.value), 1);
    const stepX = innerW / Math.max(1, data.length - 1);
    const pts = data.map((d, i) => ({ x: pad.l + i * stepX, y: pad.t + innerH - (d.value / max) * innerH, label: d.label, value: d.value }));
    const linePath = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(2) + ' ' + p.y.toFixed(2)).join(' ');
    const bottomY = (pad.t + innerH).toFixed(2);
    const areaPath = linePath + ` L${pts[pts.length-1].x.toFixed(2)} ${bottomY} L${pts[0].x.toFixed(2)} ${bottomY} Z`;
    const yTicks = 4;
    const yLines = Array.from({length: yTicks + 1}, (_, i) => {
      const y = pad.t + (innerH / yTicks) * i;
      const v = Math.round(max - (max / yTicks) * i);
      return `<line class="chart-grid" x1="${pad.l}" y1="${y.toFixed(2)}" x2="${(W - pad.r).toFixed(2)}" y2="${y.toFixed(2)}"/>
              <text class="chart-y-label" x="${(pad.l - 10)}" y="${(y + 4).toFixed(2)}" text-anchor="end">${v.toLocaleString('ru-RU')}</text>`;
    }).join('');
    const gradId = 'grad_' + Math.random().toString(36).slice(2, 9);
    el.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block">
        <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#10b981" stop-opacity=".28"/>
          <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
        </linearGradient></defs>
        ${yLines}
        <path class="chart-area" d="${areaPath}" fill="url(#${gradId})"/>
        <path class="chart-line" d="${linePath}"/>
        ${pts.map(p => `<circle class="chart-dot" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="4.5"/>
          <text class="chart-label" x="${p.x.toFixed(2)}" y="${(H - 10)}" text-anchor="middle">${Utils.escape(p.label)}</text>`).join('')}
      </svg>`;
  },

  bindGlobal() {
    window.addEventListener('hashchange', () => this.render());
    document.addEventListener('click', (e) => this.handleClick(e));
    document.addEventListener('keydown', (e) => this.handleKeydown(e));
  },

  handleKeydown(e) {
    if (e.key === 'Escape') {
      const modal = document.getElementById('modal-root');
      if (modal.classList.contains('show')) { this.closeModal(); return; }
      if (this.state.globalQuery && this.state.route !== 'transactions') {
        this.state.globalQuery = ''; this.render(); return;
      }
      if (this.state.route === 'transactions' && this.state.txFilter.q) {
        this.state.txFilter.q = ''; this.state.txFilter.page = 1; this.render();
      }
    }
  },

  attachAuth() {
    const loginForm = document.getElementById('loginForm');
    if (loginForm) loginForm.addEventListener('submit', (e) => this.handleLogin(e));
    const regForm = document.getElementById('registerForm');
    if (regForm) regForm.addEventListener('submit', (e) => this.handleRegister(e));
  },

  attachApp(user) {
    const input = document.getElementById('topSearchInput');
    if (input) {
      if (this.state.route === 'transactions') this._bindLocalSearch(input);
      else this._bindGlobalSearch(input, user);
    }
    const adminSearch = document.querySelector('[data-admin-search]');
    if (adminSearch) {
      adminSearch.addEventListener('input', () => {
        const val = adminSearch.value;
        clearTimeout(this._searchTimer);
        this._searchTimer = setTimeout(() => {
          this.state.adminUserFilter = val;
          this.render();
          requestAnimationFrame(() => {
            const el = document.querySelector('[data-admin-search]');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          });
        }, 250);
      });
    }
    const sf = document.getElementById('supportForm');
    if (sf) {
      sf.addEventListener('submit', (e) => {
        e.preventDefault();
        const data = new FormData(sf);
        if (!data.get('name') || !data.get('email') || !data.get('topic') || !data.get('message')) { Toast.show('Заполните все поля', 'error'); return; }
        Toast.show('Сообщение отправлено!');
        sf.reset();
        if (sf.querySelector('[name=name]'))  sf.querySelector('[name=name]').value  = user.name;
        if (sf.querySelector('[name=email]')) sf.querySelector('[name=email]').value = user.email;
      });
    }
    document.querySelectorAll('[data-setting]').forEach(inp => {
      inp.addEventListener('change', () => {
        const u = Auth.current();
        const s = { ...(u.settings || {}), [inp.dataset.setting]: inp.checked };
        Auth.update({ settings: s });
        Toast.show('Настройки сохранены');
      });
    });
  },

  _bindGlobalSearch(input, user) {
    input.addEventListener('input', () => {
      const val = input.value;
      clearTimeout(this._searchTimer);
      this._searchTimer = setTimeout(() => {
        this.state.globalQuery = val;
        this.updateGlobalPanel(user);
      }, 120);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!this.state.globalQuery.trim()) return;
        this.state.txFilter.q = this.state.globalQuery;
        this.state.txFilter.page = 1;
        this.state.globalQuery = '';
        this.go('transactions');
      } else if (e.key === 'Escape') {
        e.preventDefault();
        input.value = '';
        this.state.globalQuery = '';
        this.updateGlobalPanel(user);
      }
    });
    input.addEventListener('focus', () => { if (this.state.globalQuery) this.updateGlobalPanel(user); });
  },

  _bindLocalSearch(input) {
    input.addEventListener('input', () => {
      const val = input.value;
      const pos = input.selectionStart;
      clearTimeout(this._searchTimer);
      this._searchTimer = setTimeout(() => {
        this.state.txFilter.q = val;
        this.state.txFilter.page = 1;
        this.render();
        requestAnimationFrame(() => {
          const el = document.getElementById('topSearchInput');
          if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
        });
      }, 180);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(this._searchTimer);
        this.state.txFilter.q = input.value;
        this.state.txFilter.page = 1;
        this.render();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        clearTimeout(this._searchTimer);
        input.value = '';
        this.state.txFilter.q = '';
        this.state.txFilter.page = 1;
        this.render();
      }
    });
  },

  handleClick(e) {
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      e.preventDefault();
      const to = nav.dataset.nav;
      this.state.globalQuery = '';
      this.state.txFilter.q = '';
      this.state.txFilter.page = 1;
      this.state.adminUserFilter = '';
      if (to === 'login' || to === 'register') { location.hash = to; this.render(); }
      else { this.go(to); }
      return;
    }

    const adminEdit = e.target.closest('[data-admin-edit]');
    if (adminEdit) { e.preventDefault(); this.openAdminEditUser(adminEdit.dataset.adminEdit); return; }
    const adminRole = e.target.closest('[data-admin-role]');
    if (adminRole) { e.preventDefault(); this.openAdminRoleChange(adminRole.dataset.adminRole); return; }
    const adminDel = e.target.closest('[data-admin-delete]');
    if (adminDel) { e.preventDefault(); this.confirmAdminDeleteUser(adminDel.dataset.adminDelete); return; }
    const adminUserRow = e.target.closest('[data-admin-user]');
    if (adminUserRow) { e.preventDefault(); this.openAdminEditUser(adminUserRow.dataset.adminUser); return; }

    const action = e.target.closest('[data-action]');
    if (action) { e.preventDefault(); this.handleAction(action.dataset.action, action); return; }

    const togglePass = e.target.closest('[data-toggle-pass]');
    if (togglePass) {
      const inp = togglePass.parentElement.querySelector('input');
      if (inp.type === 'password') { inp.type = 'text'; togglePass.innerHTML = Icons.eye; }
      else { inp.type = 'password'; togglePass.innerHTML = Icons.eyeOff; }
      return;
    }
    const oauth = e.target.closest('[data-oauth]');
    if (oauth) { e.preventDefault(); Toast.show('OAuth временно недоступен — используйте вход по email', 'info'); return; }

    const ftype = e.target.closest('[data-filter-type]');
    if (ftype) { this.state.txFilter.type = ftype.dataset.filterType; this.state.txFilter.page = 1; this.render(); return; }

    const pg = e.target.closest('[data-page]');
    if (pg) { this.state.txFilter.page = parseInt(pg.dataset.page, 10); this.render(); return; }

    const tx = e.target.closest('[data-tx]');
    if (tx) { this.showTxDetails(tx.dataset.tx); return; }

    if (e.target.classList.contains('modal-overlay')) { this.closeModal(); return; }
    if (e.target.closest('.modal-close')) { this.closeModal(); return; }
  },

  handleAction(action, el) {
    switch (action) {
      case 'logout':
        Auth.logout();
        this.state.txFilter = { type:'all', q:'', page:1 };
        this.state.globalQuery = ''; this.state.adminUserFilter = '';
        location.hash = '';
        this.render();
        Toast.show('Вы вышли из аккаунта', 'info');
        break;
      case 'clear-search':
        if (this.state.route === 'transactions') { this.state.txFilter.q = ''; this.state.txFilter.page = 1; }
        else this.state.globalQuery = '';
        this.render();
        break;
      case 'add-tx':       this.openAddTx(); break;
      case 'add-goal':     this.openAddGoal(); break;
      case 'add-cat':      this.openAddCategory('expense'); break;
      case 'notifications':this.openNotifications(); break;
      case 'edit-profile': this.openEditProfile(); break;
      case 'change-pass':  this.openChangePass(); break;
      case 'export-json':  this.exportJSON(); break;
      case 'export':       this.exportCSV(); break;
      case 'reset-my':     this.confirmResetMy(); break;
      case 'delete-account': this.confirmDeleteAccount(); break;
      case 'close-modal':  this.closeModal(); break;
      case 'add-card':     this.openAddCard(); break;
      case 'sync-card':    this.syncCard(el.dataset.cardId); break;
      case 'default-card': this.setDefaultCard(el.dataset.cardId); break;
      case 'delete-card':  this.confirmDeleteCard(el.dataset.cardId); break;
      case 'goal-deposit': this.openGoalDeposit(el.dataset.goalId); break;
      case 'goal-edit':    this.openGoalEdit(el.dataset.goalId); break;
      case 'goal-delete':  this.confirmGoalDelete(el.dataset.goalId); break;
      case 'admin-create-user': this.openAdminCreateUser(); break;
      case 'admin-export':      this.adminExportAll(); break;
      case 'admin-export-excel': Admin.exportUsersExcel(); break;
      case 'admin-export-word':  Admin.exportUsersWord(); break;
    }
  },

  handleLogin(e) {
    e.preventDefault();
    const form = e.target;
    const email = form.email.value.trim();
    const password = form.password.value;
    const remember = form.remember.checked;
    if (!email || !password) { Toast.show('Заполните все поля', 'error'); return; }
    try {
      Auth.login(email, password, remember);
      Toast.show('Добро пожаловать в Финансист!');
      location.hash = 'dashboard';
      this.render();
    } catch (err) { Toast.show(err.message, 'error'); }
  },

  handleRegister(e) {
    e.preventDefault();
    const form = e.target;
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const password = form.password.value;
    const password2 = form.password2.value;
    const agree = form.agree.checked;
    if (!name || !email || !password || !password2) { Toast.show('Заполните все поля', 'error'); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { Toast.show('Введите корректный email', 'error'); return; }
    if (password.length < 6) { Toast.show('Пароль должен быть не короче 6 символов', 'error'); return; }
    if (password !== password2) { Toast.show('Пароли не совпадают', 'error'); return; }
    if (!agree) { Toast.show('Необходимо согласиться с условиями', 'error'); return; }
    try {
      Auth.register({ name, email, password });
      Toast.show('Аккаунт создан!');
      location.hash = 'dashboard';
      this.render();
    } catch (err) { Toast.show(err.message, 'error'); }
  },

  openModal(html, wide) {
    const root = document.getElementById('modal-root');
    root.innerHTML = `<div class="modal-overlay"></div><div class="modal-box ${wide?'wide':''}">${html}</div>`;
    root.classList.add('show');
    document.body.style.overflow = 'hidden';
  },
  closeModal() {
    const root = document.getElementById('modal-root');
    root.classList.remove('show');
    root.innerHTML = '';
    document.body.style.overflow = '';
  },

  openNotifications() {
    const u = Auth.current();
    const list = u.notifications || [];
    const unread = list.filter(n => n.unread).length;
    this.openModal(`
      <button class="modal-close" type="button">${Icons.x}</button>

        <div class="field-row">

        </div>
        <div class="field">
          <label>Дата и время операции <span class="req">*</span></label>
          <div class="input-wrap">

            <input type="datetime-local" name="datetime" value="${nowValue}" required>
          </div>
          <span class="hint">Укажите точный час и минуты — например, 14:30</span>
        </div>
        ${cardOptions ? `
        <div class="field">
          <label>Способ оплаты</label>
          <div class="input-wrap no-icon"><select name="cardId">${cardOptions}</select></div>
          <span class="hint">Если выбрана карта, операция свяжется с ней</span>
        </div>` : ''}
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Отмена</button>
          <button type="submit" class="btn btn-primary">${Icons.plus} Добавить</button>
        </div>
      </form>
    `);
    const form = document.getElementById('txForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = new FormData(form);
      const type = data.get('type');
      const amountRaw = parseFloat(data.get('amount'));
      const title = (data.get('title')||'').trim();
      const dtValue = data.get('datetime');
      if (!title || !amountRaw || !dtValue) { Toast.show('Заполните все поля', 'error'); return; }
      const amount = type === 'income' ? Math.abs(amountRaw) : -Math.abs(amountRaw);
      const cardId = data.get('cardId') || null;
      let address = '';
      if (cardId) {
        const card = user.cards.find(c => c.id === cardId);
        if (card) {
          address = type === 'income'
            ? 'Зачисление на карту •••• ' + card.last4
            : 'Оплата картой •••• ' + card.last4;
        }
      }
      const tx = {
        id: 'tx_' + Utils.uid(),
        title,
        amount, type,
        category: data.get('category') || 'Прочее',
        date: Utils.localToISO(dtValue),
        address,
        cardId
      };
      const u = Auth.current();
      u.transactions.unshift(tx);
      if (cardId) {
        const cards = u.cards.map(c => c.id === cardId ? { ...c, txCount: (c.txCount||0)+1 } : c);
        Auth.update({ transactions: u.transactions, cards });
      } else {
        Auth.update({ transactions: u.transactions });
      }
      this.closeModal();
      Toast.show('Операция добавлена');
      this.render();
    });
  },

  openGoalDeposit(goalId) {
    const u = Auth.current();
    const goal = (u.goals||[]).find(g => g.id === goalId);
    if (!goal) return;
    const remaining = Math.max(0, goal.target - goal.current);
    this.openModal(`
      <button class="modal-close" type="button">${Icons.x}</button>
      <h3>Пополнить цель</h3>
      <p class="msub">${Utils.escape(goal.title)} · ${Utils.fmtMoney(goal.current)} из ${Utils.fmtMoney(goal.target)}</p>
      <form id="depositForm">
        <div class="field">
          <label>Сумма пополнения, ₽ <span class="req">*</span></label>
          <div class="input-wrap"><svg class="left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><input type="number" name="amount" placeholder="Например: 5000" min="1" required autofocus></div>
          <span class="hint">Осталось накопить: ${Utils.fmtMoney(remaining)}</span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Отмена</button>
          <button type="submit" class="btn btn-primary">${Icons.plus} Пополнить</button>
        </div>
      </form>
    `);
    setTimeout(() => {
      const inp = document.querySelector('#depositForm [name=amount]');
      if (inp) inp.focus();
    }, 50);
    const form = document.getElementById('depositForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = parseFloat(new FormData(form).get('amount'));
      if (!amount || amount <= 0) { Toast.show('Введите сумму больше 0', 'error'); return; }
      const cur = Auth.current();
      const goals = (cur.goals||[]).map(g => g.id === goalId
        ? { ...g, current: g.current + Math.round(amount) }
        : g
      );
      Auth.update({ goals });
      this.closeModal();
      const g2 = goals.find(g => g.id === goalId);
      if (g2 && g2.current >= g2.target) {
        Toast.show('🎉 Цель достигнута!');
      } else {
        Toast.show('Цель пополнена на ' + Utils.fmtMoney(amount));
      }
      this.render();
    });
  },

    const holderInput = document.getElementById('cardHolderInput');
    const bankSelect = document.getElementById('cardBankSelect');
    const cpNumber = document.getElementById('cpNumber');
    const cpBrand = document.getElementById('cpBrand');
    const cpExpiry = document.getElementById('cpExpiry');
    const cpHolder = document.getElementById('cpHolder');

    const updatePreview = () => {
      const num = numInput.value.replace(/\D/g,'');

      const system = Utils.detectCardSystem(num);
      cpBrand.textContent = system.toUpperCase();
      preview.className = 'card-preview ' + system;
      cpExpiry.textContent = expInput.value || '••/••';
      cpHolder.textContent = (holderInput.value || 'CARD HOLDER').toUpperCase();
      cpBank.textContent = (bankSelect.value || 'БАНК').toUpperCase();
    };

    numInput.addEventListener('input', (e) => {
      const clean = e.target.value.replace(/\D/g,'').slice(0,16);
      e.target.value = clean.replace(/(.{4})/g,'$1 ').trim();
      updatePreview();
    });
    expInput.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g,'').slice(0,4);
      if (v.length >= 2) v = v.slice(0,2) + '/' + v.slice(2);
      e.target.value = v;
      updatePreview();
    });
    holderInput.addEventListener('input', updatePreview);
    bankSelect.addEventListener('change', updatePreview);
    updatePreview();

      const data = new FormData(form);

      const cvv = data.get('cvv');
      const holder = (data.get('holder')||'').trim();
      const bank = data.get('bank');

      if (!/^\d{3,4}$/.test(cvv)) { Toast.show('CVV — 3 или 4 цифры', 'error'); return; }

      try {
        const u = Auth.current();

        this.closeModal();

        this.render();
      } catch (err) {
        Toast.show('Ошибка: ' + err.message, 'error');
      }
    });

  syncCard(cardId) {
    const user = Auth.current();
    const card = (user.cards||[]).find(c => c.id === cardId);
    if (!card) return;
    const cardEl = document.querySelector(`[data-card="${cardId}"]`);
    if (cardEl) {
      const overlay = document.createElement('div');
      overlay.className = 'card-syncing-overlay';
      overlay.innerHTML = `
        <div class="spin"></div>
        <b>Синхронизация…</b>
        <p>Загружаем операции из банка</p>
      `;
      cardEl.appendChild(overlay);
    }
    setTimeout(() => {
      const newTxs = Cards.simulateSync(user, cardId, 7);
      const updatedCards = user.cards.map(c => c.id === cardId
        ? { ...c, lastSync: new Date().toISOString(), txCount: (c.txCount||0) + newTxs.length }
        : c
      );
      Auth.update({
        transactions: [...newTxs, ...user.transactions],
        cards: updatedCards
      });
      const notif = {
        id: 'n_' + Utils.uid(),
        type: 'op',
        color: '#10b981',
        title: 'Синхронизация карты',
        text: `Загружено ${newTxs.length} операций с карты ${card.bank} •••• ${card.last4}`,
        time: 'Только что',
        unread: true
      };
      const u2 = Auth.current();
      Auth.update({ notifications: [notif, ...(u2.notifications||[])] });
      this.closeModal();
      Toast.show(`Синхронизировано: ${newTxs.length} операций`);
      this.render();
    }, 1500);
  },

  exportCSV() {
    const u = Auth.current();
    const list = Finance.filterTransactions(u.transactions, this.state.txFilter);
    const rows = [['Дата','Время','Название','Категория','Тип','Сумма','Карта']];
    list.forEach(t => {
      const d = new Date(t.date);
      rows.push([
        d.toLocaleDateString('ru-RU'),
        d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),
        t.title, t.category, t.type, t.amount,
        t.cardId ? 'да' : ''
      ]);
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type:'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'finansist-operations.csv';
    a.click();
    Toast.show('Операции экспортированы');
  },

    Toast.show('Экспортировано ' + users.length + ' пользователей');
  }
};

/* ============================================================
   11. TOAST
   ============================================================ */
const Toast = {
  show(message, type = 'success', duration = 3200) {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast' + (type === 'error' ? ' error' : type === 'info' ? ' info' : '');
    const iconSvg = type === 'error'
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
      : type === 'info'
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    el.innerHTML = `<div class="tic">${iconSvg}</div><div style="flex:1">${message}</div>`;
    root.appendChild(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 320);
    }, duration);
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
